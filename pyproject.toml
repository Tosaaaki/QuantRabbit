[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-rabbit-vnext"
version = "0.1.0"
description = "QuantRabbit vNext rebuild: history ingestion, risk gateway, and dry-run execution core."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
crypto-stream = ["websockets>=16,<17"]

[project.scripts]
qr-vnext = "quant_rabbit.cli:main"
qr-crypto = "quant_rabbit.crypto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_rabbit = ["*.json"]
